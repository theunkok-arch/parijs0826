<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Reisgids voor ons gezinsweekend Parijs, 20 t/m 23 augustus 2026.">
  <title>Parijs met Roos &amp; Isis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">

    <header class="header">
      <div class="header-row">
        <div class="header-titles">
          <h1 id="site-title">Parijs</h1>
          <p id="site-subtitle" class="subtitle"></p>
        </div>
        <div class="header-actions">
          <button class="btn-translate" id="share-btn" type="button">Deel</button>
          <a class="btn-translate" href="https://translate.google.com/?sl=nl&amp;tl=fr&amp;op=translate" target="_blank" rel="noopener">Vertaal FR</a>
        </div>
      </div>
    </header>

    <nav class="daynav" id="daynav" aria-label="Dagen"></nav>

    <div class="searchbar">
      <input type="search" id="search" placeholder="Zoek: nike, entrecote, versailles…" aria-label="Zoeken in het programma" autocomplete="off">
    </div>

    <main id="main">
      <section id="days"></section>
      <section id="tickets-view" hidden></section>
      <section id="search-view" hidden></section>
    </main>

    <footer class="footer">
      <p id="footer-checked"></p>
      <p>Foto's via Wikimedia Commons, makers in docs.</p>
    </footer>

  </div>
  <script src="js/app.js"></script>
</body>
</html>
